[project]
name = "putesestvije"
version = "0.1.0"
description = "CLI za planiranje putovanja: ponude domaćih agencija, istorija cena, preporuke i Trello tabla Putešestvije"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pt = "putesestvije.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/putesestvije"]

[tool.pytest.ini_options]
pythonpath = ["src"]
