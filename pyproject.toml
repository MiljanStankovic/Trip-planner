[project]
name = "putovanja"
version = "0.5.0"
description = "Pregledač ponuda domaćih turističkih agencija po kontinentima i zemljama, sa detaljima i slanjem u Trello"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
putovanja = "putovanja.cli:main"
pt = "putovanja.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/putovanja"]

[tool.pytest.ini_options]
pythonpath = ["src"]
