[project]
name = "putovanja"
version = "1.0.0"
description = "Ponude 20 domaćih turističkih agencija po kontinentima i zemljama: istorija cena, detalji sa sajtova, preporuke i Trello"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "rich>=13.7",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
putovanja = "putovanja.cli:main"
pt = "putovanja.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/putovanja"]

[tool.pytest.ini_options]
pythonpath = ["src"]
