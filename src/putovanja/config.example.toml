# Putovanja — podešavanja
# Kopija ide u ~/.config/putovanja/config.toml (komanda: pt init)
# ili postavi PT_CONFIG=/putanja/do/config.toml

[profil]
home_airport = "BEG"
alt_airports = ["BUD", "TSR", "INI"]   # razmotri ako je osetno jeftinije
currency = "EUR"
# budget_per_person = 600              # gornja granica po osobi za jedan aranžman (odkomentariši i upiši)
transport = ["avion", "autobus", "sopstveni"]
min_days_ahead = 5                     # ne predlaži polaske ranije od ovoga
max_days_ahead = 180
min_nights = 1
max_nights = 10
likes = []                             # šta volite, npr. ["advent", "budimpešta", "wellness"]
dislikes = []
rsd_per_eur = 117                      # kurs za poređenje cena u dinarima sa budžetom
odraslih = 2                           # koliko odraslih putuje
dece = 0                               # koliko dece putuje
uzrast_dece = []                       # godine dece, npr. [5, 9] (za popuste za decu)

[agencije]
# Python čita sve agencije koje alat zna (i nove, kad se dodaju). Filip Travel, Ponte i Plana čita Claude.
# Da neku preskočiš, upiši je ovde, npr. ["jumbo"]
iskljucene = []

[trello]
# Samo uz plugin putovanja-trello. Upiši ID svoje table i lista (Claude to uradi za tebe kad uključiš plugin).
# Ključ i token NE upisuj ovde; stavi ih u okruženje: TRELLO_KEY, TRELLO_TOKEN
board_id = ""

[trello.lists]
# predlozi = "<id liste>"
# planirano = "<id liste>"
