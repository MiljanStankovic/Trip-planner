# Putešestvije — podešavanja
# Kopija ide u ~/.config/putesestvije/config.toml (komanda: pt init)
# ili postavi PT_CONFIG=/putanja/do/config.toml

[profil]
home_airport = "BEG"
alt_airports = ["BUD", "TSR", "INI"]   # razmotri ako je osetno jeftinije
currency = "EUR"
# budget_per_person = 600              # gornja granica po osobi za jedan aranžman (odkomentariši i upiši)
transport = ["avion", "autobus", "sopstveni"]
min_days_ahead = 5                     # ne predlaži polaske ranije od ovoga
max_days_ahead = 180
min_nights = 1
max_nights = 10
likes = ["advent", "budimpešta", "segedin", "divčibare"]   # sa naše table; dopuni
dislikes = []
rsd_per_eur = 117                      # kurs za poređenje cena u dinarima sa budžetom

[agencije]
# Agencije koje Python čita direktno. Filip Travel, Ponte i Plana čita Claude (/putesestvije:agencije).
ukljucene = ["travelland", "argus", "grandtours", "felix", "fibula", "kontiki", "bigblue", "odeon"]

[trello]
board_id = "6ad4cd042c7e038b9e1d453a"   # Putešestvije
