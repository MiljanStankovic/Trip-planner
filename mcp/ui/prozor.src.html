<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Putovanja</title>
<style>
  :root {
    color-scheme: light dark;
    --poz: var(--color-background-primary, #ffffff);
    --poz2: var(--color-background-secondary, #f5f4ed);
    --poz3: var(--color-background-tertiary, #faf9f5);
    --t1: var(--color-text-primary, #141413);
    --t2: var(--color-text-secondary, #3d3d3a);
    --t3: var(--color-text-tertiary, #73726c);
    --l1: var(--color-border-tertiary, rgba(31, 30, 29, .15));
    --l2: var(--color-border-secondary, rgba(31, 30, 29, .3));
    --ok: var(--color-text-success, #265b19);
    --okp: var(--color-background-success, #e9f1dc);
    --info: var(--color-text-info, #3266ad);
    --upoz: var(--color-text-warning, #5a4815);
    --upozp: var(--color-background-warning, #f6eedf);
    --r: var(--border-radius-md, 8px);
    --rs: var(--border-radius-sm, 6px);
    --font: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
    /* jedini sopstveni ton: cena */
    --cena: #a35400;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --cena: #f3b94d; --poz: var(--color-background-primary, #30302e); --poz2: var(--color-background-secondary, #262624); --poz3: var(--color-background-tertiary, #141413); --t1: var(--color-text-primary, #faf9f5); --t2: var(--color-text-secondary, #c2c0b6); --t3: var(--color-text-tertiary, #9c9a92); --l1: var(--color-border-tertiary, rgba(222, 220, 209, .15)); --l2: var(--color-border-secondary, rgba(222, 220, 209, .3)); --ok: var(--color-text-success, #7ab948); --okp: var(--color-background-success, #1b4614); --info: var(--color-text-info, #80aadd); --upoz: var(--color-text-warning, #d1a041); --upozp: var(--color-background-warning, #483a0f); } }
  :root[data-theme="dark"] { --cena: #f3b94d; }
  :root[data-theme="light"] { --cena: #a35400; }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--t1); font-family: var(--font); font-size: 14px; line-height: 1.4; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--info); outline-offset: 1px; }
  [hidden] { display: none !important; }
  .app { padding: 10px 4px 6px; }
  .app { padding-bottom: calc(var(--dno, 0px) + 6px); }
  .app.siroko { padding-bottom: calc(var(--dno, 0px) + 96px) !important; }
  .verzija { color: var(--t3); font-size: 11px; }
  .app.siroko { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 24px; padding: 14px 18px; min-height: 100vh; align-items: start; }
  .glavno { min-width: 0; }
  svg.ik { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* bočna traka (proširen prikaz): odeljci gore, destinacije ispod */
  .bocno { position: sticky; top: 14px; display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 28px); overflow: auto; padding-right: 4px; }
  .marka { display: flex; align-items: center; gap: 10px; padding: 2px 8px 14px; }
  .marka .znak { width: 30px; height: 30px; border-radius: 9px; background: var(--cena); color: var(--poz); display: grid; place-items: center; }
  .marka .znak svg { width: 18px; height: 18px; stroke-width: 1.8; }
  .marka b { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .marka small { display: block; color: var(--t3); font-size: 12px; }
  .stavka-nav { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; padding: 7px 10px; border-radius: var(--r); color: var(--t2); text-align: left; font-size: 14px; }
  .stavka-nav:hover { background: var(--poz2); color: var(--t1); }
  .stavka-nav[aria-current="true"] { background: var(--poz2); color: var(--t1); font-weight: 600; }
  .stavka-nav .broj, .tab .broj { margin-left: auto; min-width: 20px; text-align: center; padding: 0 6px; border-radius: 999px; background: var(--upozp); color: var(--upoz); font-size: 11.5px; font-weight: 600; }
  .deo { color: var(--t3); font-size: 12px; padding: 16px 10px 4px; }
  .kont { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: transparent; padding: 5px 10px; border-radius: var(--rs); color: var(--t1); text-align: left; font-size: 13.5px; }
  .kont:hover { background: var(--poz2); }
  .kont .str { width: 12px; color: var(--t3); transition: transform .15s; }
  .kont[aria-expanded="true"] .str { transform: rotate(90deg); }
  .kont small, .zem small { margin-left: auto; color: var(--t3); font-size: 12px; font-variant-numeric: tabular-nums; }
  .zem { display: flex; width: 100%; border: 0; background: transparent; padding: 4px 10px 4px 28px; border-radius: var(--rs); color: var(--t2); text-align: left; font-size: 13px; }
  .zem:hover { background: var(--poz2); color: var(--t1); }
  .zem[aria-pressed="true"] { background: var(--poz2); color: var(--t1); font-weight: 600; box-shadow: inset 2px 0 0 var(--cena); }
  .dno-bocno { margin-top: 14px; padding: 10px; border-top: 1px solid var(--l1); color: var(--t3); font-size: 12px; display: grid; gap: 8px; }
  .siroko .vrh { display: none; }
  .zag-glavno { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 16px; margin: 2px 0 8px; }
  .zag-glavno h2 { margin: 0; font-size: 22px; }
  .tab { display: inline-flex; align-items: center; gap: 6px; }
  .malo { display: inline-flex; align-items: center; gap: 6px; }

  /* zaglavlje: odeljci levo, prikaz desno */
  .vrh { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
  .tabovi { display: flex; gap: 2px; flex-wrap: wrap; }
  .tab { border: 0; background: transparent; padding: 6px 10px; border-radius: var(--rs); color: var(--t2); }
  .tab[aria-current="page"] { background: var(--poz2); color: var(--t1); font-weight: 600; }
  .malo { border: 1px solid var(--l1); background: transparent; border-radius: var(--rs); padding: 4px 10px; font-size: 13px; color: var(--t2); }

  .red-kontrola { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 6px 0; }
  .oznaka { color: var(--t3); font-size: 12.5px; }
  .seg { display: inline-flex; flex-wrap: wrap; background: var(--poz2); border-radius: var(--r); padding: 2px; gap: 1px; }
  .seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: var(--rs); color: var(--t2); font-size: 13px; }
  .seg button[aria-pressed="true"] { background: var(--poz); color: var(--t1); font-weight: 600; box-shadow: 0 0 0 1px var(--l1); }
  .cipovi { display: flex; flex-wrap: wrap; gap: 6px; }
  .cip { border: 1px solid var(--l1); background: transparent; border-radius: 999px; padding: 3px 11px; font-size: 13px; color: var(--t2); }
  .cip[aria-pressed="true"] { border-color: var(--t1); color: var(--t1); font-weight: 600; }
  .cip small { color: var(--t3); margin-left: 4px; font-weight: 400; }

  h2 { font-size: 17px; font-weight: 650; margin: 10px 0 2px; letter-spacing: -0.01em; }
  h2 small { font-size: 13px; color: var(--t2); font-weight: 400; margin-left: 6px; }

  /* lista ponuda */
  ol.lista { list-style: none; margin: 8px 0 0; padding: 0; border-top: 1px solid var(--l1); }
  .red { display: grid; grid-template-columns: 50px minmax(0, 1fr) 104px 104px; gap: 12px; align-items: center; padding: 9px 6px; border-bottom: 1px solid var(--l1); cursor: pointer; }
  .red:hover { background: var(--poz2); }
  .datum { text-align: center; border: 1px solid var(--l2); border-radius: var(--rs); overflow: hidden; line-height: 1.1; }
  .datum .m { display: block; font-size: 10.5px; padding: 2px 0; background: var(--poz2); color: var(--t2); }
  .datum .d { display: block; font-size: 17px; font-weight: 650; padding: 3px 0 1px; font-variant-numeric: tabular-nums; }
  .datum .n { display: block; font-size: 10.5px; color: var(--t3); padding-bottom: 3px; }
  .datum.bez { border-style: dashed; color: var(--t3); font-size: 11px; padding: 7px 2px; }
  .naziv { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pop { display: inline-block; margin-left: 6px; font-size: 12px; font-weight: 600; color: var(--ok); background: var(--okp); padding: 0 6px; border-radius: 999px; vertical-align: 1px; }
  .sporedno { color: var(--t2); font-size: 12.5px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .put { font-size: 13px; }
  .put .ik { display: inline-block; width: 1.4em; }
  .put small { display: block; color: var(--t2); font-size: 12.5px; margin-left: 1.4em; }
  .tiho { color: var(--t3); }
  .cena { text-align: right; }
  .cena b { display: block; font-size: 15.5px; font-weight: 700; color: var(--cena); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cena b .od { font-size: 11.5px; font-weight: 500; color: var(--t2); margin-right: 3px; }
  .cena small { color: var(--t2); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .strane { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 2px 0; color: var(--t3); font-size: 12.5px; }
  .strane .dugmad { display: flex; gap: 6px; }
  .prazno { padding: 22px 6px; color: var(--t2); }
  .poruka { margin: 8px 0; padding: 8px 10px; border-radius: var(--r); background: var(--upozp); color: var(--upoz); font-size: 13px; }

  /* detalj ponude */
  .nazad { border: 0; background: transparent; color: var(--info); padding: 2px 0; font-size: 13px; }
  .det-naslov { font-size: 19px; font-weight: 650; margin: 6px 0 2px; letter-spacing: -0.01em; }
  .det-pod { color: var(--t2); font-size: 13px; }
  .cinjenice { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
  .cinj { background: var(--poz2); border-radius: var(--r); padding: 8px 10px; }
  .cinj span { display: block; color: var(--t3); font-size: 12px; }
  .cinj b { font-size: 14.5px; font-weight: 600; }
  .cinj b.c { color: var(--cena); font-size: 16px; }
  .ukupno { border: 1px solid var(--l1); border-radius: var(--r); padding: 10px 12px; margin: 10px 0; }
  .ukupno .glavno { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-weight: 600; }
  .ukupno .glavno b { color: var(--cena); font-size: 17px; }
  .stavka { display: flex; justify-content: space-between; gap: 10px; color: var(--t2); font-size: 13px; padding: 2px 0; }
  .akcije { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .dugme { border: 1px solid var(--l2); background: var(--poz); border-radius: var(--r); padding: 6px 12px; font-size: 13.5px; }
  .dugme.glavno { background: var(--t1); color: var(--poz); border-color: var(--t1); font-weight: 600; }
  details { border-top: 1px solid var(--l1); padding: 8px 0; }
  details summary { cursor: pointer; font-weight: 600; }
  details ul { margin: 6px 0 0; padding-left: 18px; color: var(--t2); }
  details li { margin: 2px 0; }

  /* kalendar, praćeno, uradi sam, izvori */
  .dan-zag { font-weight: 600; margin: 10px 0 2px; }
  .dan-zag small { color: var(--t3); font-weight: 400; margin-left: 6px; }
  .mini { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 6px; border-bottom: 1px solid var(--l1); cursor: pointer; }
  .mini:hover { background: var(--poz2); }
  .mini b { color: var(--cena); font-variant-numeric: tabular-nums; }
  .forma { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin: 8px 0; }
  .forma label { display: block; color: var(--t3); font-size: 12px; }
  .forma input { width: 100%; padding: 6px 8px; border: 1px solid var(--l2); border-radius: var(--rs); background: var(--poz); }
  .linkovi { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 8px 0; }
  .linkovi h3 { font-size: 13px; margin: 0 0 4px; color: var(--t2); font-weight: 600; }
  .link { display: block; border: 0; background: transparent; color: var(--info); padding: 3px 0; text-align: left; font-size: 13.5px; }
  .agencija { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--l1); font-size: 13.5px; }
  .agencija .st-ok { color: var(--ok); }
  .agencija .st-los { color: var(--upoz); }

  /* ---------- telefon ---------- */
  /* preko celog ekrana na telefonu i tabletu (dodir) Claude crta svoje dugme za zatvaranje i naslov preko vrha,
     a polje za pisanje preko dna: sadržaj počinje ispod njih. Važi i za uspravan (kao telefon) i položen tablet (sa bočnom trakom).
     Bezbedna zona od Claude-a plus mesto za njegovo zaglavlje, a ako je ne pošalje, makar 96 px gore. */
  /* Android pregledač sam uvećava tekst u širim karticama (pa cena izlazi iz kartice); veličine su već podešene */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  .kartica .cena { min-width: 0; text-align: right; }
  .kartica .cena span, .kartica .cena small { white-space: nowrap; }
  body.dodir.ceo { --vrh-claude: max(calc(var(--gore, 0px) + 64px), 96px); }
  body.dodir.ceo .app { padding-top: var(--vrh-claude) !important; padding-bottom: max(var(--dno, 0px), 120px) !important; }
  body.dodir.ceo .app.siroko { min-height: 0; }
  body.dodir.ceo .bocno { top: var(--vrh-claude); max-height: calc(100vh - var(--vrh-claude) - 14px); }
  body.mob.ceo .app { padding-left: max(var(--levo, 0px), 4px); padding-right: max(var(--desno, 0px), 4px); }
  .mob .app, .app.mob { padding: 6px 2px 10px; }
  .mob .vrh { margin-bottom: 6px; flex-wrap: nowrap; }
  .mob .vrh { display: block; }
  .mob .tabovi { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; border-bottom: 1px solid var(--l1); padding-bottom: 4px; }
  .mob .tabovi::-webkit-scrollbar, .traka::-webkit-scrollbar { display: none; }
  .mob .tab { flex-direction: column; gap: 3px; padding: 7px 2px 6px; min-height: 52px; font-size: 11.5px; position: relative; }
  .mob .tab svg.ik { width: 20px; height: 20px; }
  .mob .tab .broj { position: absolute; top: 3px; right: 10%; margin: 0; font-size: 10px; padding: 0 5px; }
  .mob #prosiri { display: none; }
  .traka { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 4px -2px 2px; padding: 2px; }
  .traka .cip { flex: none; min-height: 44px; padding: 0 16px; font-size: 14px; }
  .mob h2 { font-size: 20px; margin: 12px 0 2px; }
  .filter-dugme { display: flex; width: 100%; min-height: 48px; align-items: center; gap: 8px; margin: 10px 0 4px; padding: 0 14px; border: 1px solid var(--l1); border-radius: var(--r); background: var(--poz2); text-align: left; font-size: 14px; }
  .filter-dugme b { font-weight: 600; }
  .filter-dugme .str { margin-left: auto; color: var(--t3); }
  .filter-panel { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--l1); border-top: 0; border-radius: 0 0 var(--r) var(--r); margin-top: -6px; }
  .filter-panel .cipovi .cip, .sve-zemlje .cipovi .cip, .mob .traka-putnici .cip { min-height: 44px; padding: 0 15px; font-size: 14px; }
  ol.kartice { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
  @media (min-width: 700px) { .mob ol.kartice { grid-template-columns: 1fr 1fr; } .mob .app { padding: 10px 12px; } }
  .kartica { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 12px 14px; border: 1px solid var(--l1); border-radius: var(--r); background: var(--poz); cursor: pointer; }
  .kartica:active { background: var(--poz2); }
  .kartica .naziv { white-space: normal; font-size: 15.5px; line-height: 1.3; }
  .kartica .kad { color: var(--t1); font-size: 13.5px; margin-top: 4px; }
  .kartica .kad .d { color: var(--t1); font-weight: 600; }
  .kartica .kad { color: var(--t2); }
  .kartica .ko { color: var(--t3); font-size: 12.5px; margin-top: 2px; }
  .kartica .cena { grid-column: 2; grid-row: 1 / span 3; align-self: center; }
  .kartica .cena b { font-size: 17px; }
  .vise { display: block; width: 100%; min-height: 48px; margin: 10px 0 0; padding: 0 12px; border: 1px solid var(--l1); border-radius: var(--r); background: transparent; font-size: 14px; color: var(--t2); }
  .sve-zemlje { margin-top: 6px; }
  .sve-zemlje .kont-zag { font-size: 12.5px; color: var(--t3); margin: 12px 2px 6px; }
  .sve-zemlje .cipovi .cip { padding: 8px 13px; font-size: 14px; }
  .mob .akcije { display: grid; grid-template-columns: 1fr 1fr; }
  .mob .akcije .dugme { min-height: 48px; padding: 0 10px; font-size: 14px; }
  .mob .nazad { min-height: 44px; font-size: 14px; }
  .mob .akcije .dugme.glavno { grid-column: 1 / -1; }
  .mob .det-naslov { font-size: 20px; }
  .mob .cinj { padding: 10px 12px; }
  .mob .traka-putnici { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .mob .traka-putnici .cip { flex: none; white-space: nowrap; padding: 8px 13px; font-size: 14px; }
  .stavka span + span { white-space: nowrap; }
  .mob .akcije .dugme:nth-child(4) { grid-column: 1 / -1; }
  .cip { white-space: nowrap; }
  .mob .mini { padding: 10px 6px; }

  @media (max-width: 600px) {
    .red { grid-template-columns: 44px minmax(0, 1fr) auto; }
    .red .put { grid-column: 2; grid-row: 2; display: flex; gap: 8px; }
    .red .put small { display: inline; margin: 0; }
    .red .cena { grid-column: 3; grid-row: 1 / span 2; }
    .cinjenice { grid-template-columns: 1fr 1fr; }
    .forma { grid-template-columns: 1fr 1fr; }
    .linkovi { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="bocno" id="bocno" hidden></aside>
  <main class="glavno">
    <div class="vrh" id="vrh">
      <nav class="tabovi" id="tabovi" aria-label="Odeljci aplikacije"></nav>
      <button class="malo" id="prosiri" hidden><svg class="ik" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg><span>Proširi</span></button>
    </div>
    <div id="sadrzaj"></div>
  </main>
</div>

<script type="module">
/*SDK*/
{ // sopstveni kod u svom bloku, da se imena ne sudare sa ugrađenim SDK-om
const { App, applyDocumentTheme, applyHostStyleVariables, applyHostFonts } = window.__mcpApps;

// ---------- pomoćne ----------
const MES = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'avg', 'sep', 'okt', 'nov', 'dec'];
const MES_PUNO = ['januar', 'februar', 'mart', 'april', 'maj', 'jun', 'jul', 'avgust', 'septembar', 'oktobar', 'novembar', 'decembar'];
const DAN = ['ned', 'pon', 'uto', 'sre', 'čet', 'pet', 'sub'];
const DAN_PUNO = ['nedelja', 'ponedeljak', 'utorak', 'sreda', 'četvrtak', 'petak', 'subota'];
const PREVOZ = { avion: ['✈️', 'avion'], autobus: ['🚌', 'autobus'], sopstveni: ['🚗', 'sopstveni'], brod: ['🚢', 'brod'], voz: ['🚆', 'voz'] };
const PUTNICI = [['1+0', '1 osoba'], ['2+0', '2 odrasla'], ['2+1', '2 + dete'], ['2+2', '2 + 2 dece'], ['3+0', '3 odrasla'], ['4+0', '4 odrasla']];
const SORT = [['preporuka', 'Preporučeno'], ['cena', 'Najjeftinije'], ['datum', 'Najranije'], ['popust', 'Popust']];

const $ = (id) => document.getElementById(id);
const IKONE = {"ponude": "<rect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"2\"/><path d=\"M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18\"/>", "kalendar": "<rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M8 3v4M16 3v4M3 10h18\"/>", "praceno": "<path d=\"M6 9a6 6 0 0 1 12 0c0 6 3 7 3 7H3s3-1 3-7\"/><path d=\"M10 20a2 2 0 0 0 4 0\"/>", "uradisam": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m15.5 8.5-2 5-5 2 2-5z\"/>", "izvori": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18\"/>"};
const ikona = (k) => `<svg class="ik" viewBox="0 0 24 24" aria-hidden="true">${IKONE[k] ?? ''}</svg>`;
const ODELJCI = [['ponude', 'Ponude'], ['kalendar', 'Kalendar'], ['praceno', 'Praćeno'], ['uradisam', 'Uradi sam'], ['izvori', 'Izvori']];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const iznos = (v, val) => v ? `${Math.round(v).toLocaleString('de-DE')} ${val === 'RSD' ? 'din' : '€'}` : '';
const polasci = (n) => n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? `${n} polaska` : `${n} polazaka`;
const noci = (n) => n === 0 ? 'izlet' : !n ? '' : (n % 10 === 1 && n !== 11) ? `${n} noć` : `${n} noći`;
const popust = (p) => p.old_price && p.price && p.old_price > p.price ? Math.round(100 * (p.old_price - p.price) / p.old_price) : 0;
const eur = (p) => !p.price ? 1e9 : p.currency === 'RSD' ? p.price / 117 : p.price;
const ime = (p) => p.naziv || p.title || p.destination;
const kratakDatum = (d) => d ? `${d.slice(8, 10)}.${d.slice(5, 7)}.` : '';
const putnici = (s) => { const [a, d] = (s || '2+0').split('+').map(Number); return { odrasli: a || 1, deca: d || 0, ukupno: (a || 1) + (d || 0) }; };
const sacuvaj = (k, v) => { try { localStorage.setItem('putovanja.' + k, JSON.stringify(v)); } catch {} };
const procitaj = (k, def) => { try { const v = localStorage.getItem('putovanja.' + k); return v ? JSON.parse(v) : def; } catch { return def; } };

function datumHtml(d) {
  if (!d) return '<div class="datum bez">po izboru</div>';
  const dt = new Date(d + 'T12:00:00');
  return `<div class="datum"><span class="m">${MES[dt.getMonth()]}</span><span class="d">${dt.getDate()}</span><span class="n">${DAN[dt.getDay()]}</span></div>`;
}
function termini(p) {
  if (p.termini?.length) return p.termini;
  const d = p.svi_datumi?.length ? p.svi_datumi : [p.date_from];
  return d.map((datum) => ({ id: p.id, datum, noci: p.nights, cena: p.price, stara: p.old_price, valuta: p.currency }));
}
function grupisi(lista, sort) {
  const mapa = new Map();
  for (const p of lista) {
    const k = `${p.agencija}|${(p.url || '').split('?')[0]}|${(p.title || '').toLowerCase()}`;
    mapa.set(k, [...(mapa.get(k) ?? []), p]);
  }
  const ture = [...mapa.values()].map((svi) => { const po = [...svi].sort((a, b) => (a.date_from ?? '9999').localeCompare(b.date_from ?? '9999')); return { glavna: po[0], svi: po }; });
  if (sort === 'cena') ture.sort((a, b) => Math.min(...a.svi.map(eur)) - Math.min(...b.svi.map(eur)));
  else if (sort === 'datum') ture.sort((a, b) => (a.glavna.date_from ?? '9999').localeCompare(b.glavna.date_from ?? '9999'));
  else if (sort === 'popust') ture.sort((a, b) => Math.max(...b.svi.map(popust)) - Math.max(...a.svi.map(popust)));
  return ture;
}

let VERZIJA = '0.3.2';
// telefon: uzak prozor; tablet (ekran na dodir): uspravno kao telefon, položeno kao računar.
// Orijentacija se čita sa ekrana, ne iz prozora: prozor u razgovoru raste u visinu sa sadržajem.
const naDodir = () => { try { return matchMedia('(pointer: coarse)').matches; } catch { return false; } };

// ---------- veza sa Claude-om ----------
const app = new App({ name: 'Putovanja', version: VERZIJA }, { availableDisplayModes: ['inline', 'fullscreen'] });
async function pozovi(name, args = {}) {
  const r = await app.callServerTool({ name, arguments: args });
  const d = r?.structuredContent ?? (() => { try { return JSON.parse(r?.content?.[0]?.text ?? '{}'); } catch { return {}; } })();
  if (d?.skeniranje) S.sken = d.skeniranje;
  return d;
}
async function pt(komanda, ...argumenti) {
  const d = await pozovi('putovanja_podaci', { komanda, argumenti: argumenti.map(String) });
  if (d?.rezultat?.greska) throw new Error(d.rezultat.greska);
  return d?.rezultat;
}
async function radi(poruka, fn) {
  S.ucitava = poruka; S.greska = ''; crtaj();
  try { await fn(); } catch (e) { S.greska = String(e?.message ?? e); }
  S.ucitava = ''; crtaj();
}

    if (z) S.lista = (await pt('zemlja', z)) ?? [];
    else S.lista = (await pt('top', 'preporuka', '--limit', '60'))?.ponude ?? [];
  });
}
async function otvoriPonudu(p) {
  S.ponuda = { ...p, ucitano: false };

let tajmer = null;

  const d = await pozovi('skeniraj_agencije');

  sacuvaj('diy', S.diy); otvoriDiy();
});
$('sadrzaj').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.target.classList?.contains('red') || e.target.classList?.contains('kartica'))) e.target.click(); });

// ---------- start ----------
function tema(ctx) {
  if (!ctx) return;
  if (ctx.theme) applyDocumentTheme(ctx.theme);
  if (ctx.styles?.variables) applyHostStyleVariables(ctx.styles.variables);
  if (ctx.styles?.css?.fonts) applyHostFonts(ctx.styles.css.fonts);
  if (ctx.displayMode) S.prikaz = ctx.displayMode;
  const sa = ctx.safeAreaInsets;
  if (sa) for (const [k, v] of [['--gore', sa.top], ['--dno', sa.bottom], ['--levo', sa.left], ['--desno', sa.right]])
    document.documentElement.style.setProperty(k, `${Math.max(Number(v) || 0, 0)}px`);
  if (ctx.availableDisplayModes) S.modovi = ctx.availableDisplayModes;
}
app.onhostcontextchanged = (ctx) => { tema({ ...app.getHostContext(), ...ctx }); crtaj(); };
app.ontoolresult = (r) => {
  const d = r?.structuredContent; if (!d?.lista) return;
  S.lista = d.lista; S.zemlje = d.zemlje ?? {}; S.stanje = d.stanje; S.zemlja = d.zemlja ?? ''; S.sken = d.skeniranje;
  if (d.verzija) VERZIJA = d.verzija;
  const k = Object.entries(S.zemlje).find(([, z]) => S.zemlja in z)?.[0]; if (k) S.kontinent = k;
  if (d.prikaz === 'kalendar') return otvoriKalendar();
  if (d.prikaz === 'praceno') return otvoriPraceno();
  if (d.prikaz === 'uradisam') return otvoriDiy();
  crtaj();
  pt('obavestenja').then((o) => { S.obav = o; crtaj(); }).catch(() => {});
};
crtaj();
await app.connect();
tema(app.getHostContext());
crtaj();
// odmah preko celog prozora, ako Claude to dozvoljava; ako ne, ostaje u razgovoru
if (S.modovi.includes('fullscreen') && S.prikaz !== 'fullscreen') promeniPrikaz('fullscreen');
}
</script>
